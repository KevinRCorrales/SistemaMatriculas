<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión · Portal UCC</title>
    <style>
      :root {
        --azul: #17497a;
        --azul-oscuro: #0e3358;
        --verde: #0d6b4f;
        --texto: #172433;
        --texto-suave: #4a5b6d;
        --borde: #dde4ed;
        --fondo: #f7f9fc;
      }

      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }

      body {
        min-height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        overflow-y: auto;
        box-sizing: border-box;
        font-family:
          "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--texto);
        background:
          radial-gradient(circle at 15% 10%, #e7f5ee 0, transparent 36%),
          radial-gradient(circle at 90% 85%, #eaf2fb 0, transparent 40%),
          var(--fondo);
      }

      main {
        width: min(560px, 100%);
        margin: auto;
        padding: 40px;
        border: 1px solid var(--borde);
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 24px 60px rgba(14, 51, 88, 0.12);
        text-align: center;
      }

      img {
        display: block;
        width: 104px;
        height: 104px;
        margin: 0 auto 22px;
        object-fit: contain;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
        color: var(--azul-oscuro);
      }

      p {
        margin: 0 auto 12px;
        max-width: 44ch;
        font-size: 15px;
        line-height: 1.6;
        color: var(--texto-suave);
      }

      .url {
        display: block;
        margin: 18px auto;
        padding: 10px 14px;
        border: 1px dashed var(--borde);
        border-radius: 10px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        color: var(--azul);
        word-break: break-all;
        background: var(--fondo);
      }

      .acciones {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }

      button {
        min-height: 44px;
        padding: 0 22px;
        border: 1px solid transparent;
        border-radius: 10px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .principal {
        color: #ffffff;
        background: var(--azul);
      }

      .principal:hover:not(:disabled) {
        background: var(--azul-oscuro);
      }

      .secundario {
        color: var(--azul);
        border-color: var(--borde);
        background: #ffffff;
      }

      .secundario:hover:not(:disabled) {
        border-color: var(--azul);
      }

      details {
        margin-top: 22px;
        font-size: 12px;
        color: var(--texto-suave);
        text-align: left;
      }

      summary {
        cursor: pointer;
      }

      code {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        word-break: break-word;
      }

      @media (max-height: 650px) {
        body {
          padding: 16px;
        }

        main {
          padding: 24px 28px;
        }

        img {
          width: 78px;
          height: 78px;
          margin-bottom: 16px;
        }

        h1 {
          font-size: 23px;
        }

        .acciones {
          margin-top: 16px;
        }

        details {
          margin-top: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/icon.png" alt="Universidad Cooperativa de Colombia" />
      <h1>No se pudo conectar con el portal</h1>
      <p>
        No pudimos abrir el portal en este momento. Revisa tu conexión a la red
        e inténtalo de nuevo.
      </p>
      <span class="url" data-url></span>
      <div class="acciones">
        <button class="principal" type="button" id="reintentar">
          Reintentar
        </button>
        <button class="secundario" type="button" id="navegador">
          Abrir en el navegador
        </button>
      </div>
      <details>
        <summary>Información para soporte</summary>
        <p><code data-detalle></code></p>
      </details>
    </main>
    <script src="sin-conexion.js"></script>
  </body>
</html>
